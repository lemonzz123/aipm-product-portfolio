PingFang SC&#x27;,&#x27;Helvetica Neue&#x27;,Arial,sans-serif" font-size="14" font-weight="bold" fill="#212121" x="272" y="421.0"><title>区块标题-召回结果</title>召回结果</text><text id="召回结果统计" data-component="召回结果统计" data-type="text" font-family="&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,&#x27;Helvetica Neue&#x27;,Arial,sans-serif" font-size="12" font-weight="normal" fill="#757575" text-anchor="start" x="272.0" y="446.2"><title>召回结果统计</title>共召回 3 个参考片段（TopK = 5）</text><rect id="召回片段-1" data-component="召回片段-1" data-type="recallcard"  x="272" y="462" width="1136" height="82" rx="2" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1"/><title>召回片段-1</title><title>召回片段-1</title><text font-family="&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,&#x27;Helvetica Neue&#x27;,Arial,sans-serif" font-size="12" font-weight="bold" fill="#212121" x="288" y="488">产品使用手册 v3.pdf · 第 12 页</text><text font-family="&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,&#x27;Helvetica Neue&#x27;,Arial,sans-serif" font-size="12" fill="#333333" x="288" y="520">退款申请可在「订单中心 - 售后申请」提交，审核通过后 3-5 个工作日原路退回。</text><rect x="1298" y="474" width="94" height="26" fill="#F0F0F0" stroke="#BDBDBD" stroke-width="1" rx="2"/><text font-family="&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,&#x27;Helvetica Neue&#x27;,Arial,sans-serif" font-size="11" fill="#333333" text-anchor="middle" x="1345" y="491">相似度 0.89</text><rect id="召回片段-2" data-component="召回片段-2" data-type="recallcard"  x="272" y="554" width="1136" height="82" rx="2" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1"/><title>召回片段-2</title><title>召回片段-2</title><text font-family="&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,&#x27;Helvetica Neue&#x27;,Arial,sans-serif" font-size="12" font-weight="bold" fill="#212121" x="288" y="580">售后政策说明.pdf · 第 3 页</text><text font-family="&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,&#x27;Helvetica Neue&#x27;,Arial,sans-serif" font-size="12" fill="#333333" x="288" y="612">自签收之日起 7 天内可申请无理由退货，商品需保持完好且配件齐全。</text><rect x="1298" y="566" width="94" height="26" fill="#F0F0F0" stroke="#BDBDBD" stroke-width="1" rx="2"/><text font-family="&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,&#x27;Helvetica Neue&#x27;,Arial,sans-serif" font-size="11" fill="#333333" text-anchor="middle" x="1345" y="583">相似度 0.84</text><rect id="召回片段-3" data-component="召回片段-3" data-type="recallcard"  x="272" y="646" width="1136" height="82" rx="2" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1"/><title>召回片段-3</title><title>召回片段-3</title><text font-family="&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,&#x27;Helvetica Neue&#x27;,Arial,sans-serif" font-size="12" font-weight="bold" fill="#212121" x="288" y="672">常见问题汇总.xlsx · 条目 28</text><text font-family="&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,&#x27;Helvetica Neue&#x27;,Arial,sans-serif" font-size="12" fill="#333333" x="288" y="704">如遇退款未到账，请先核对支付渠道流水，或联系人工客服处理。</text><rect x="1298" y="658" width="94" height="26" fill="#F0F0F0" stroke="#BDBDBD" stroke-width="1" rx="2"/><text font-family="&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,&#x27;Helvetica Neue&#x27;,Arial,sans-serif" font-size="11" fill="#333333" text-anchor="middle" x="1345" y="675">相似度 0.76</text><text id="区块标题-回答预览" data-component="区块标题-回答预览" data-type="sectiontitle" font-family="&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,&#x27;Helvetica Neue&#x27;,Arial,sans-serif" font-size="14" font-weight="bold" fill="#212121" x="272" y="771.0"><title>区块标题-回答预览</title>回答预览</text><rect id="回答预览框" data-component="回答预览框" data-type="answerbox"  x="272" y="786" width="1136" height="96" rx="2" fill="#FFFFFF" stroke="#757575" stroke-width="1"/><title>回答预览框</title><title>回答预览框</title><text font-family="&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,&#x27;Helvetica Neue&#x27;,Arial,sans-serif" font-size="12" fill="#333333" x="286" y="814">你可以在订单中心发起售后退款申请。审核通过后，款项将在 3-5 个工作日内原路退回。</text><text font-family="&#x27;Microsoft YaHei&#x27;,&#x27;PingFang SC&#x27;,&